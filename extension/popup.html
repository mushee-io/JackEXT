<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>JackEXT</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div><span class="eyebrow">33JACK SHOPPING ADAPTER</span><h1>Jack<span>EXT</span></h1></div><span class="tag">Beta 0.1</span></header>
<p class="lead">Scan a product, compare matching offers, and draft an estimate.</p>
<form id="form">
<label for="title">Product</label><input id="title" maxlength="220" placeholder="e.g. black leather tote bag" required>
<div class="split"><div><label for="price">Current price</label><input id="price" type="number" min="0" step=".01" placeholder="10.00"></div>
<div><label for="currency">Currency</label><select id="currency"><option>GBP</option><option>USD</option><option>EUR</option></select></div></div>
<label for="endpoint">Comparison API</label><input id="endpoint" placeholder="http://localhost:3000">
<div class="actions"><button type="submit" id="compare">Compare live</button><button type="button" class="secondary" id="demo">Try demo</button></div>
</form>
<div class="actions subactions"><button type="button" class="linkbtn" id="scan">↻ Scan this page</button><button type="button" class="linkbtn" id="widget">◫ Show floating widget</button></div>
<div id="status" role="status" aria-live="polite"></div><div id="results"></div>
<footer>Only scan pages you choose. Demo prices are examples; real offers require a configured provider. Always verify merchant checkout totals.</footer>
<script type="module" src="popup.js"></script>
</body></html>
